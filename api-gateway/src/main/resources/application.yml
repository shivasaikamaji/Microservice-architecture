server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

spring:
  application:
    name: api-gateway

  data:
    redis:
      host: localhost
      port: 6379

  cloud:
    gateway:
      server:
        webflux:

          # Default filters applied to all routes
          default-filters:
            # Limit request body size to 1 MB
            - name: RequestSize
              args:
                maxSize: 1MB

            # Redis-based request rate limiting
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 1
                redis-rate-limiter.burstCapacity: 3
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@userKeyResolver}"

          # Microservice routes
          routes:
            # User Service
            - id: user-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/users/**
              filters:
                - RewritePath=/api/users(?<segment>/?.*), /users$\{segment}

            # Product Service
            - id: product-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/products/**
              filters:
                - RewritePath=/api/products(?<segment>/?.*), /api/v1/products$\{segment}

            # Order Service
            - id: order-service
              uri: http://localhost:8083
              predicates:
                - Path=/api/orders/**
              filters:
                - RewritePath=/api/orders(?<segment>/?.*), /api/v1/orders$\{segment}

            # Payment Service
            - id: payment-service
              uri: http://localhost:8084
              predicates:
                - Path=/api/payments/**
              filters:
                - RewritePath=/api/payments(?<segment>/?.*), /api/v1/payments$\{segment}